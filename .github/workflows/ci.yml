name: CI Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Eval Threshold Check (Non-Blocking)
        id: evals_check
        continue-on-error: true
        run: npm run evals:check

      - name: Report Eval Threshold Warning
        if: steps.evals_check.outcome == 'failure'
        run: |
          echo "::warning title=Eval Thresholds::Deterministic eval thresholds were not met. Review npm run evals:check output."
